name: Actualizar datos
on:
  schedule:
    - cron: "30 12 * * 1-5"   # 09:30 en Argentina (UTC-3): daily previo a la apertura
    - cron: "30 21 * * 1-5"   # 18:30 en Argentina: daily de cierre (EE.UU. ya cerró todo el año)
  workflow_dispatch:
    inputs:
      modo:
        description: "Tipo de daily"
        type: choice
        options: [apertura, intradia, cierre]
        default: apertura
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance feedparser anthropic
      - run: python update_data.py --modo "${{ inputs.modo || (github.event.schedule == '30 21 * * 1-5' && 'cierre' || 'apertura') }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: |
          git config user.name "morning-brief-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git commit -m "Datos $(date -u +%F-%H%M)" || exit 0
          git push
